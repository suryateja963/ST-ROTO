[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "st-roto"
version = "0.0.1.dev0"
description = "AI-assisted and traditional rotoscoping inside Foundry Nuke (pre-alpha, not usable yet)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.7"       # Nuke 13 ships Python 3.7 [unverified, T-032]; core code must stay 3.7-compatible
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
