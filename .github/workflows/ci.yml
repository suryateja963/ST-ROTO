name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    # Pure-Python core only. Tests that need Nuke run locally with `nuke -t` (Nuke cannot run in CI).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ["3.9", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  python37-tests:
    # Nuke 13 ships Python 3.7 (D-017). The full unit suite is RUN on 3.7 (a static checker, vermin, gave
    # non-deterministic results locally and was replaced on 2026-11-15).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.7"
      - run: python -m pip install "numpy==1.21.6" "opencv-python-headless==4.8.1.78" "pytest==7.4.4"
      - run: python -m pytest
